services:
  db:
    image: mariadb:11.4.5
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${COMPAT_DB_PASSWORD:?runner must provide COMPAT_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${COMPAT_DB_ROOT_PASSWORD:?runner must provide COMPAT_DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 45
    volumes:
      - wordpress_db:/var/lib/mysql

  wordpress:
    image: ${WORDPRESS_IMAGE:?runner must provide WORDPRESS_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${COMPAT_DB_PASSWORD:?runner must provide COMPAT_DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      COMPAT_TABLE_PREFIX: ${COMPAT_TABLE_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: |
        $$table_prefix = getenv('COMPAT_TABLE_PREFIX') ?: 'wp_';
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wordpress_data:/var/www/html
      - ${REPO_ROOT:?runner must provide REPO_ROOT}:/var/www/html/wp-content/plugins/gigpress:ro
      - ./probe.php:/compat/probe.php:ro
      - ./fixtures:/compat/fixtures:ro
      - ./fixtures/php-floor-plugin.php:/var/www/html/wp-content/plugins/php-floor-plugin.php:ro

volumes:
  wordpress_data:
  wordpress_db:
